name: Sonar

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - sonar*
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    # if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.6.0
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache node_modules for connectors
        uses: actions/cache@v4
        with:
          path: src/appmixer/**/node_modules
          # TODO: also cache package-lock.json files?
          key: ${{ runner.os }}-connector-npm-${{ hashFiles('src/appmixer/**/package.json') }}
      - name: Install connector dependencies
        run: node ./scripts/npm_install.js
      - name: Run unit tests and coverage
        run: npm run test-unit-coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
