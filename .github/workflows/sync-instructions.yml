# Keeps .github/copilot-instructions.md in sync with its source of truth — the
# instructions/ directory of the public Appmixer-ai/appmixer-skills repository.
#
# Nobody has to remember to run build-instructions by hand: this workflow
# regenerates the file on a schedule (and on demand via workflow_dispatch) and
# opens a PR only when the content actually changed. The fetch is a public
# tarball, so no cross-repo secrets are involved.
#
# Known GitHub limitation: PRs opened with the built-in GITHUB_TOKEN do not
# trigger `pull_request` workflows, so the sync PR shows no CI checks. For a
# generated-docs-only diff that is acceptable — review is "does the diff look
# like the skills change", then merge.

name: Sync Copilot instructions

on:
  schedule:
    - cron: '0 6 * * 1-5'   # weekday mornings UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate from appmixer-skills
        run: node scripts/build-instructions.js

      - name: Open or update the sync PR when the content changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet .github/copilot-instructions.md; then
            echo "In sync — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=bot/sync-copilot-instructions
          git checkout -B "$BRANCH"
          git add .github/copilot-instructions.md
          git commit -m "docs: sync Copilot instructions from appmixer-skills"
          git push -f origin "$BRANCH"
          gh pr create --base dev --head "$BRANCH" \
            --title "docs: sync Copilot instructions from appmixer-skills" \
            --body "Automated regeneration of \`.github/copilot-instructions.md\` from the [appmixer-skills](https://github.com/Appmixer-ai/appmixer-skills) \`instructions/\` sources (scheduled \`sync-instructions\` workflow). Review = does the diff match the recent skills change, then merge." \
            2>/dev/null || echo "PR already open — branch updated."
